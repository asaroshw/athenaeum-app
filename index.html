<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Athenaeum Financial Intelligence</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #E6E6E6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            overscroll-behavior-y: none; /* Disables mobile swipe-to-refresh */
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 0 20px 0;
            border-bottom: 1px solid #1F1F1F;
            margin-bottom: 20px;
        }
        .logo { height: 42px; filter: invert(1); }
        .title { font-size: 1.2rem; font-weight: 800; letter-spacing: 1.5px; color: #FFFFFF; }
        
        .card {
            background: #0D0D0D;
            border: 1px solid #1F1F1F;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .search-box {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #262B36;
            background: #161B22;
            color: #FFFFFF;
            font-size: 1rem;
            margin-bottom: 10px;
            outline: none;
        }
        .search-box:focus { border-color: #EAB308; }
        .btn-analyze {
            width: 100%;
            padding: 14px;
            background: #EAB308;
            color: #000000;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-analyze:active { background: #ca9a07; }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .metric-box {
            background: #161B22;
            border: 1px solid #262B36;
            padding: 12px;
            border-radius: 8px;
        }
        .metric-label { font-size: 0.75rem; color: #8B949E; text-transform: uppercase; font-weight: 600; }
        .metric-val { font-size: 1.2rem; font-weight: 700; color: #FFFFFF; margin-top: 4px; }
        
        .verdict-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .buy { background: rgba(63, 185, 80, 0.2); color: #3FB950; border: 1px solid #3FB950; }
        .observe { background: rgba(249, 115, 22, 0.2); color: #F97316; border: 1px solid #F97316; }
        .dont-buy { background: rgba(248, 81, 73, 0.2); color: #F85149; border: 1px solid #F85149; }

        .narrative-text {
            color: #C9D1D9;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-line;
        }
        .loading { text-align: center; color: #EAB308; padding: 20px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- App Header -->
    <div class="header">
        <img src="Logo.png" class="logo" alt="Logo" onerror="this.style.display='none'">
        <div class="title">ATHENAEUM</div>
    </div>

    <!-- Search Section -->
    <div class="card">
        <input type="text" id="tickerInput" class="search-box" placeholder="Enter Company Name or Ticker (e.g. RELIANCE)">
        <button onclick="analyzeStock()" class="btn-analyze">Analyse Stock</button>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading" style="display:none;">
        Analyzing financials & fetching AI narrative...
    </div>

    <!-- Analysis Results Container -->
    <div id="results" style="display:none;">
        
        <!-- Main Verdict Card -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                    <div style="color:#8B949E; font-size:0.8rem;" id="resSector">Sector</div>
                    <div style="font-size:1.3rem; font-weight:800; color:#FFF;" id="resName">Company Name</div>
                    <div style="color:#8B949E; font-size:0.85rem;" id="resTicker">TICKER.NS</div>
                    <div id="resBadge" class="verdict-badge">VERDICT</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:1.5rem; font-weight:800; color:#FFF;" id="resPrice">₹0.00</div>
                    <div style="color:#8B949E; font-size:0.75rem;">Current Price</div>
                </div>
            </div>

            <div class="metric-grid">
                <div class="metric-box">
                    <div class="metric-label">Target Price</div>
                    <div class="metric-val" id="resTarget">₹0.00</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">P/E Ratio</div>
                    <div class="metric-val" id="resPE">N/A</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">P/B Ratio</div>
                    <div class="metric-val" id="resPB">N/A</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Model Used</div>
                    <div class="metric-val" style="font-size:0.9rem; margin-top:8px;" id="resModel">DCF</div>
                </div>
            </div>
        </div>

        <!-- AI Narrative Card -->
        <div class="card">
            <div style="color:#38BDF8; font-weight:700; margin-bottom:12px;">AI Executive Narrative</div>
            <div class="narrative-text" id="resNarrative"></div>
        </div>
    </div>

    <script>
        async function analyzeStock() {
            const input = document.getElementById('tickerInput').value.trim();
            if(!input) return;

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            loading.style.display = 'block';
            results.style.display = 'none';

            try {
                // Fetch from your live Render API
                const res = await fetch(`https://athenaeum-backend-9uht.onrender.com/api/analyze?ticker=${encodeURIComponent(input)}`);
                const json = await res.json();

                if(json.status === 'success') {
                    const m = json.metrics;
                    const p = m.predictive;

                    document.getElementById('resName').innerText = m.name;
                    document.getElementById('resTicker').innerText = m.ticker;
                    document.getElementById('resSector').innerText = `${m.sector} • ${m.industry}`;
                    document.getElementById('resPrice').innerText = `₹${m.price}`;
                    document.getElementById('resTarget').innerText = `₹${p.target_price}`;
                    document.getElementById('resPE').innerText = typeof m.pe_ratio === 'number' ? m.pe_ratio.toFixed(2) : m.pe_ratio;
                    document.getElementById('resPB').innerText = typeof m.pb_ratio === 'number' ? m.pb_ratio.toFixed(2) : m.pb_ratio;
                    document.getElementById('resModel').innerText = p.model_used;
                    document.getElementById('resNarrative').innerText = json.ai_narrative;

                    // Set Verdict Color Badge
                    const badge = document.getElementById('resBadge');
                    badge.innerText = p.verdict;
                    badge.className = 'verdict-badge ' + (
                        p.verdict === 'BUY' ? 'buy' : 
                        p.verdict === 'OBSERVE' ? 'observe' : 'dont-buy'
                    );

                    loading.style.display = 'none';
                    results.style.display = 'block';
                } else {
                    alert('Could not find stock data.');
                    loading.style.display = 'none';
                }
            } catch(e) {
                alert('Error connecting to backend API.');
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
